<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="logo">MySite</div>
  </header>
  <div class="auth-card">
    <h2>Mario Archive</h2>
    <p>Sign in or create an account to enter</p>

    <div class="auth-tabs">
      <button id="tab-login" class="tab-btn active">Log In</button>
      <button id="tab-signup" class="tab-btn">Sign Up</button>
    </div>

    <!-- Login Form -->
     <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn">Log In</button>
     </form>

     <!-- Sign Up Form (hidden by default) -->
     <form id="signup-form" class="hidden">
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
     </form>

     <p id="auth-status" class="status-msg"></p>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
